<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bếp của Mẹ · Mom's Vietnamese recipes</title>
<meta name="description" content="Bếp của Mẹ: my mom's Vietnamese home cooking, written down the way she makes it.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Bếp của Mẹ">
<meta property="og:description" content="My mom's Vietnamese home cooking, written down the way she makes it.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FBFCFA' stroke='%232C6A8A' stroke-width='3'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23B3302A' font-family='Arial,sans-serif' font-size='16' font-weight='900'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800;900&family=Patrick+Hand&display=swap&subset=vietnamese">
<style>
/* Bếp của Mẹ: a family recipe tin. Header, dish-type index tabs, a grid of
   enamel-plate cards; a recipe opens as a full page with ingredients beside
   the steps. Recipes come from recipes.json next to this file; photos live in
   photos/. Light palette on bare :root, dark redefines tokens only. */
:root{
  --paper:#EEF2EB; --surface:#FFFFFF; --ink:#1D2921; --muted:#5A695E; --line:#D3DCD1;
  --chili:#B3302A; --chili-ink:#FFFFFF; --turmeric:#F0C25A; --note:#FBEFC8; --note-ink:#3A2E12;
  --enamel:#2C6A8A; --plate:#FBFCFA;
  --display:"Be Vietnam Pro", "Helvetica Neue", Arial, sans-serif;
  --body:"Be Vietnam Pro", "Helvetica Neue", Arial, sans-serif;
  --hand:"Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#111814; --surface:#19231D; --ink:#E4ECE5; --muted:#9BAA9F; --line:#2B3930;
    --chili:#E0615A; --chili-ink:#1A0B0A; --turmeric:#D9AE4E; --note:#3A321C; --note-ink:#F3E6C0;
    --enamel:#6FA9C8; --plate:#22302A;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--enamel);outline-offset:2px}

.home{font-size:.85rem;color:var(--muted);text-decoration:none}
.home:hover{color:var(--ink)}
.mast h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:900;letter-spacing:-.03em;line-height:.95}
.mast h1 span{color:var(--chili)}
.mast p{margin:10px 0 0;color:var(--muted);max-width:52ch}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);text-decoration:none;display:inline-block}
.btn:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}

.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search{flex:1 1 240px;max-width:360px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tab small{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tab:hover:not([aria-pressed="true"]){color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:transform .15s ease,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.plate{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--plate);box-shadow:inset 0 0 0 7px var(--enamel),inset 0 0 0 10px var(--plate),inset 0 0 0 11px var(--line);display:grid;place-items:center;overflow:hidden;width:72%;align-self:center}
.plate img{width:100%;height:100%;object-fit:cover}
.plate b{font-family:var(--display);font-weight:900;font-size:3.2rem;color:var(--chili)}
.card h3{font-size:1.2rem;font-weight:800;line-height:1.2}
.card .en{color:var(--muted);font-size:.9rem;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:.68rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--turmeric);color:#2A200A;align-self:flex-start}
.empty{padding:48px 24px;border:2px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.4rem;margin-bottom:8px}

.recipe{display:flex;flex-direction:column;gap:28px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center}
.hero h2{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:900;letter-spacing:-.025em;line-height:1}
.hero .en{font-size:1.15rem;color:var(--muted);margin-top:6px}
.hero .story{max-width:62ch;margin:14px 0 0}
.hero .plate{width:100%}
.facts{display:flex;flex-wrap:wrap;gap:24px;margin:16px 0 0;font-variant-numeric:tabular-nums}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:700;font-size:1.1rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:40px}
.cols h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}
.ing{list-style:none;margin:0;padding:0}
.ing li{padding:9px 0;border-bottom:1px solid var(--line)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:18px}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.2rem 1fr;gap:10px;max-width:65ch}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:900;font-size:1.4rem;color:var(--chili);line-height:1.2;font-variant-numeric:tabular-nums}
.note{background:var(--note);color:var(--note-ink);font-family:var(--hand);font-size:1.35rem;line-height:1.4;padding:18px 22px;border-radius:4px;transform:rotate(-.6deg);max-width:60ch}
.note small{display:block;font-family:var(--body);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:4px}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .hero .plate{width:60%;justify-self:center;grid-row:1}
  .cols{grid-template-columns:1fr;gap:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="/">← jessicawong.dev</a>

  <main id="list-view">
    <div style="display:flex;flex-direction:column;gap:28px">
      <header class="mast">
        <h1>Bếp của <span>Mẹ</span></h1>
        <p>My mom's Vietnamese home cooking, written down the way she makes it: the dishes, the amounts, and her notes.</p>
      </header>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="Search: kho, canh chua, pho…" aria-label="Search recipes">
        <div class="tabs" id="tabs" role="group" aria-label="Dish type"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">
        <h2>Recipes are on their way</h2>
        <p>Mom's dishes will show up here as they're written down.</p>
      </div>
    </div>
  </main>

  <main id="recipe-view" class="recipe" hidden></main>
</div>

<script>
const CATS=[
  ["all","Tất cả","All"],["kho","Món kho","Braised"],["canh","Canh","Soups"],["xao","Món xào","Stir-fried"],
  ["bun","Bún · Phở","Noodles"],["com","Cơm","Rice"],["banh","Bánh","Cakes & snacks"],["che","Chè","Sweet soups"],
  ["nuoc","Nước chấm","Sauces"],["khac","Món khác","Other"]];
const catLabel=k=>{const c=CATS.find(c=>c[0]===k);return c?c[1]:"Món khác"};
const $=id=>document.getElementById(id);
function el(tag,attrs,...kids){const n=document.createElement(tag);for(const k in attrs||{}){if(k==="class")n.className=attrs[k];else if(k==="text")n.textContent=attrs[k];else n.setAttribute(k,attrs[k]);}for(const c of kids)if(c!=null)n.append(c);return n;}
const fold=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const initial=s=>(String(s||"?").trim()[0]||"?").toUpperCase();
const photoSrc=p=>p?"photos/"+encodeURIComponent(p):"";

let recipes=[],cat="all";

for(const [k,vi,en] of CATS){
  const b=el("button",{class:"tab",type:"button","aria-pressed":k===cat?"true":"false"},vi,el("small",{text:en}));
  b.onclick=()=>{cat=k;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));renderList();};
  $("tabs").append(b);
}
$("q").addEventListener("input",renderList);

function plate(r){
  const p=el("div",{class:"plate"});
  const letter=()=>p.append(el("b",{text:initial(r.nameVi)}));
  if(r.photo){const i=el("img",{src:photoSrc(r.photo),alt:r.nameVi||"",loading:"lazy"});i.onerror=()=>{i.remove();letter();};p.append(i);}
  else letter();
  return p;
}

function renderList(){
  const q=fold($("q").value.trim());
  const list=recipes.filter(r=>(cat==="all"||r.category===cat)&&(!q||fold([r.nameVi,r.nameEn,r.servedWith,(r.ingredients||[]).join(" ")].join(" ")).includes(q)));
  const g=$("grid");g.replaceChildren();
  for(const r of list){
    const c=el("a",{class:"card",href:"#"+encodeURIComponent(r.id)});
    if(r.example)c.append(el("span",{class:"pill",text:"Example"}));
    c.append(plate(r),el("div",null,el("h3",{text:r.nameVi||"Untitled"}),r.nameEn?el("div",{class:"en",text:r.nameEn}):null));
    const m=el("div",{class:"meta"},el("span",{text:catLabel(r.category)}));
    if(r.timeMin)m.append(el("span",{text:`${r.timeMin} min`}));
    if(r.serves)m.append(el("span",{text:`Serves ${r.serves}`}));
    c.append(m);g.append(c);
  }
  const e=$("empty");
  if(recipes.length&&!list.length){e.hidden=false;e.querySelector("h2").textContent="No dishes match";e.querySelector("p").textContent="Try another dish type, or search without accents.";}
  else e.hidden=recipes.length>0;
}

function renderRecipe(r){
  const v=$("recipe-view");v.replaceChildren();
  v.append(el("div",null,el("a",{class:"btn",href:"#",text:"← All recipes"})));
  const head=el("div",null);
  if(r.example)head.append(el("span",{class:"pill",text:"Example"}));
  head.append(el("h2",{text:r.nameVi||"Untitled"}));
  if(r.nameEn)head.append(el("div",{class:"en",text:r.nameEn}));
  if(r.story)head.append(el("p",{class:"story",text:r.story}));
  const facts=el("dl",{class:"facts"});
  const fact=(k,val)=>val&&facts.append(el("div",null,el("dt",{text:k}),el("dd",{text:val})));
  fact("Dish type",catLabel(r.category));fact("Time",r.timeMin?`${r.timeMin} min`:"");fact("Serves",r.serves?String(r.serves):"");fact("Ăn kèm",r.servedWith);
  head.append(facts);
  v.append(el("div",{class:"hero"},head,plate(r)));
  const ing=el("ul",{class:"ing"});(r.ingredients||[]).forEach(t=>ing.append(el("li",{text:t})));
  const st=el("ol",{class:"steps"});(r.steps||[]).forEach(t=>st.append(el("li",null,el("span",{text:t}))));
  v.append(el("div",{class:"cols"},el("div",null,el("h3",{text:"Nguyên liệu · Ingredients"}),ing),el("div",null,el("h3",{text:"Cách làm · Method"}),st)));
  if(r.momNote)v.append(el("div",{class:"note"},el("small",{text:"Mẹ dặn · Mom says"}),r.momNote));
}

// #thit-kho-trung opens that recipe, so each dish has its own link.
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  const r=id&&recipes.find(x=>x.id===id);
  $("list-view").hidden=!!r;$("recipe-view").hidden=!r;
  if(r){renderRecipe(r);document.title=`${r.nameVi} · Bếp của Mẹ`;window.scrollTo(0,0);}
  else document.title="Bếp của Mẹ · Mom's Vietnamese recipes";
}
window.addEventListener("hashchange",route);

fetch("recipes.json",{cache:"no-cache"})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(data=>{
    recipes=(Array.isArray(data)?data:[]).filter(r=>r&&r.id)
      .sort((a,b)=>(a.example?1:0)-(b.example?1:0)||String(a.nameVi).localeCompare(String(b.nameVi),"vi"));
    renderList();route();
  })
  .catch(()=>{const e=$("empty");e.hidden=false;e.querySelector("h2").textContent="Couldn't load the recipes";e.querySelector("p").textContent="Refresh the page to try again.";});
</script>
</body>
</html>
