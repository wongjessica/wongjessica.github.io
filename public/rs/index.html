<title>Locked</title>
<style>
:root{--bg:#f7f7f5;--fg:#1a1a1a;--mute:#666;--line:#ccc;--card:#fff;--err:#b3261e}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(320px,calc(100vw - 32px));box-sizing:border-box}
h1{font-size:18px;margin:0 0 12px}

label{display:flex;gap:6px;align-items:center;margin:10px 0;color:var(--mute);font-size:14px}
button{width:100%;padding:10px;font:inherit;border:0;border-radius:6px;background:var(--fg);color:var(--bg);cursor:pointer}
#msg{color:var(--err);font-size:14px;min-height:1.4em;margin:8px 0 0}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},key,u(C));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pass){
  const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},b,256));
}
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(e){}

document.getElementById("f").onsubmit=async e=>{

  try{const raw=await derive(document.getElementById("p").value);await open(raw);

};
