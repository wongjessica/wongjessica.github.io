  /* Host reset — the artifact frame normally provides this. */

<body>
<style>
  /* ============================================================
     Stash — "drafting table"
     Cool blue-grey paper, olive ink, monospace chrome.
     Light palette lives on bare :root; dark redefines tokens only.
     ============================================================ */
  /* ---------------- Palette ----------------
     Only the 13 "base" colours below are editable in the Theme panel. At
     runtime a generated stylesheet (see paintPalette) overrides these plus
     every derived token with resolved literals, so custom colours re-tint
     hovers, borders, and readable text automatically.
     --shade is the direction that adds contrast against the surfaces:
     near-black on a light palette, white on a dark one.
     ---------------------------------------- */
  :root {
    color-scheme: light dark;

    /* base */
    --ground:      #E7EBF2;
    --surface:     #FBFCFE;
    --sunken:      #F1F4F9;
    --ink:         #151A23;
    --line:        #D8DDE7;
    --accent:      #57680F;
    --danger:      #A93A2B;
    --mark:        #F7D98B;
    --tok-comment: #7C8697;
    --tok-string:  #2C6B4B;
    --tok-keyword: #8A3A6B;
    --tok-number:  #A4551A;
    --tok-punct:   #6B7488;
    --shade:       #080B11;

    /* derived */
    --surface-2:   color-mix(in srgb, var(--surface) 94%, var(--shade));
    --ink-2:       color-mix(in srgb, var(--ink) 86%, var(--ground));
    --muted:       color-mix(in srgb, var(--ink) 64%, var(--ground));
    --faint:       color-mix(in srgb, var(--ink) 44%, var(--ground));
    --line-2:      color-mix(in srgb, var(--line) 82%, var(--shade));
    --accent-hi:   color-mix(in srgb, var(--accent) 85%, var(--shade));
    --accent-soft: color-mix(in srgb, var(--accent) 15%, var(--surface));
    --accent-ink:  color-mix(in srgb, var(--accent) 76%, var(--shade));
    --danger-soft: color-mix(in srgb, var(--danger) 15%, var(--surface));
    --danger-ink:  color-mix(in srgb, var(--danger) 78%, var(--shade));
    --mark-bg:     var(--mark);
    --mark-ink:    color-mix(in srgb, var(--mark) 26%, var(--shade));
    --mark-ring:   color-mix(in srgb, var(--mark) 68%, var(--shade));
    --grid:        color-mix(in srgb, var(--shade) 6%, transparent);
    --scrim:       rgba(12,16,24,.52);
    --on-accent:   var(--surface);
    --on-danger:   #FFFFFF;
    --on-ink:      var(--surface);

    --shadow:      0 1px 1px rgba(21,26,35,.04), 0 6px 20px -12px rgba(21,26,35,.28);
    --shadow-lift: 0 2px 3px rgba(21,26,35,.07), 0 22px 48px -22px rgba(21,26,35,.38);

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #0E1218;
      --surface:     #161B22;
      --sunken:      #10151B;
      --ink:         #E3E8F0;
      --line:        #242C36;
      --accent:      #B7C95A;
      --danger:      #EE8375;
      --mark:        #6A5217;
      --tok-comment: #6E7887;
      --tok-string:  #86D0A4;
      --tok-keyword: #DC9AC7;
      --tok-number:  #E8A46A;
      --tok-punct:   #96A0B0;
      --shade:       #FFFFFF;
      --scrim:       rgba(4,6,10,.66);
      --on-accent:   #0E1218;
      --on-danger:   #1A0E0B;
      --on-ink:      #10151B;
      --shadow:      0 1px 1px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.72);
      --shadow-lift: 0 2px 5px rgba(0,0,0,.5), 0 26px 54px -24px rgba(0,0,0,.82);
    }
  }
  :root[data-theme="dark"] {
    --ground:      #0E1218;
    --surface:     #161B22;
    --sunken:      #10151B;
    --ink:         #E3E8F0;
    --line:        #242C36;
    --accent:      #B7C95A;
    --danger:      #EE8375;
    --mark:        #6A5217;
    --tok-comment: #6E7887;
    --tok-string:  #86D0A4;
    --tok-keyword: #DC9AC7;
    --tok-number:  #E8A46A;
    --tok-punct:   #96A0B0;
    --shade:       #FFFFFF;
    --scrim:       rgba(4,6,10,.66);
    --on-accent:   #0E1218;
    --on-danger:   #1A0E0B;
    --on-ink:      #10151B;
    --shadow:      0 1px 1px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.72);
    --shadow-lift: 0 2px 5px rgba(0,0,0,.5), 0 26px 54px -24px rgba(0,0,0,.82);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .prose { font-family: var(--sans); }

  .app {
    display: grid;
    grid-template-columns: 254px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "bar bar" "rail workspace";
    height: 100vh;
  }

  /* ---------- Command bar ---------- */
  .bar {
    grid-area: bar;
    display: flex; align-items: center; gap: 10px;
    height: 56px; padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 9px; width: 222px; flex-shrink: 0; }
  .brand .mark {
    display: grid; place-items: center;
    width: 28px; height: 28px; border-radius: 5px;
    background: var(--accent); color: var(--on-accent);
    font-size: 13px; font-weight: 700; letter-spacing: -.04em;
  }
  .brand .wordmark { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  .brand .wordmark i { font-style: normal; color: var(--faint); font-weight: 500; }

  .find { flex: 1; min-width: 120px; max-width: 420px; position: relative; }
  .find svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .find input {
    width: 100%; padding: 7px 34px 7px 32px;
    border: 1px solid var(--line-2); border-radius: 5px;
    background: var(--ground); color: var(--ink);
    font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .find input::placeholder { color: var(--faint); }
  .find input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
  .find kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10.5px; color: var(--faint);
    border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 4px;
    pointer-events: none;
  }
  .find input:focus + kbd, .find.filled kbd { display: none; }

  .bar-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .picker { display: flex; align-items: center; gap: 6px; }
  .picker > span {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
    color: var(--faint);
  }
  select.sort {
    padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 5px;
    background: var(--surface); color: var(--ink-2); font-size: 12.5px; outline: none;
    transition: border-color .15s;
  }
  select.sort:hover { border-color: var(--accent); }

  .seg { display: flex; border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; }
  .seg button {
    display: grid; place-items: center; width: 30px; height: 30px;
    border: none; background: var(--surface); color: var(--faint);
    transition: background .12s, color .12s;
  }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button:hover { color: var(--ink); background: var(--surface-2); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }

  .icon-btn {
    display: grid; place-items: center; width: 30px; height: 30px;
    border: 1px solid var(--line-2); border-radius: 5px;
    background: var(--surface); color: var(--muted);
    transition: background .12s, color .12s, border-color .12s;
  }
  .icon-btn:hover { color: var(--ink); background: var(--surface-2); border-color: var(--line-2); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 5px; border: 1px solid transparent;
    font-size: 12.5px; font-weight: 700; letter-spacing: .01em;
    background: var(--accent); color: var(--on-accent);
    transition: background .14s, transform .06s, color .14s, border-color .14s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent-hi); }
  .btn:active { transform: translateY(1px); }
  .btn.quiet { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
  .btn.quiet:hover { background: var(--surface-2); color: var(--ink); }
  .btn.warn-quiet { background: transparent; color: var(--danger); border-color: transparent; }
  .btn.warn-quiet:hover { background: var(--danger-soft); }
  .btn.warn { background: var(--danger); color: var(--on-danger); }
  .btn.warn:hover { background: var(--danger-ink); }

  /* ---------- Index rail ---------- */
  .rail {
    grid-area: rail;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 14px 10px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 3px;
  }
  .rail-label {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 14px 8px 5px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
    color: var(--faint);
  }
  .rail-label .add {
    border: none; background: none; color: var(--faint);
    display: grid; place-items: center; width: 20px; height: 20px; border-radius: 4px;
    transition: color .12s, background .12s;
  }
  .rail-label .add:hover { color: var(--accent); background: var(--accent-soft); }

  .nav-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 7px 8px; border: none; border-radius: 5px;
    background: none; color: var(--ink-2); text-align: left;
    font-size: 13px; font-weight: 500;
    transition: background .12s, color .12s;
  }
  .nav-item .ni-icon { color: var(--faint); display: grid; place-items: center; width: 16px; flex-shrink: 0; }
  .nav-item .ni-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .count {
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    background: var(--surface-2); border-radius: 3px; padding: 1px 5px;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
  .nav-item.on .ni-icon, .nav-item.on .count { color: var(--accent-ink); }
  .nav-item.on .count { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .nav-item.drop-on {
    background: var(--accent-soft); color: var(--accent-ink);
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  .nav-item.drop-on .ni-icon, .nav-item.drop-on .count { color: var(--accent-ink); }

  .rail-hint {
    padding: 4px 9px 6px; color: var(--faint);
    font-family: var(--sans); font-size: 12px; line-height: 1.5;
  }
  .new-proj {
    margin: 2px 4px 4px; padding: 6px 9px;
    border: 1px solid var(--accent); border-radius: 5px;
    background: var(--ground); color: var(--ink);
    font-size: 13px; outline: none; box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .hidden { display: none !important; }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 6px 0; }
  .tag-nav {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border: 1px solid var(--line-2); border-radius: 20px;
    background: var(--surface); color: var(--muted);
    font-size: 11.5px; transition: color .12s, border-color .12s, background .12s;
  }
  .tag-nav b { font-weight: 500; color: var(--ink-2); }
  .tag-nav u { text-decoration: none; font-variant-numeric: tabular-nums; color: var(--faint); font-size: 10.5px; }
  .tag-nav:hover { border-color: var(--accent); color: var(--accent-ink); }
  .tag-nav:hover b { color: var(--accent-ink); }
  .tag-nav.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .tag-nav.on b, .tag-nav.on u { color: var(--accent-ink); }

  .rail-foot { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .rail-foot .btn { width: 100%; justify-content: center; }

  /* ---------- Workspace ---------- */
  .workspace {
    grid-area: workspace; overflow-y: auto; padding: 22px 24px 90px;
    background-color: var(--ground);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .ws-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 3px; }
  .ws-head h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  .ws-count { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; margin: 0 0 18px; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 6px 3px 9px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent-ink);
    font-size: 12px; font-weight: 700;
  }
  .filter-chip button {
    display: grid; place-items: center; width: 17px; height: 17px;
    border: none; border-radius: 50%; background: none; color: inherit; opacity: .65;
    transition: opacity .12s, background .12s;
  }
  .filter-chip button:hover { opacity: 1; background: color-mix(in srgb, var(--accent) 24%, transparent); }

  .group-head {
    display: flex; align-items: center; gap: 9px; margin: 24px 0 11px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
    color: var(--faint);
  }
  .group-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .group-head .g-count { letter-spacing: .04em; font-weight: 500; font-variant-numeric: tabular-nums; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow .18s, transform .18s, border-color .18s;
    cursor: pointer;
  }
  .card:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); border-color: var(--line-2); }
  .card.dragging { opacity: .4; }
  .card-top { display: flex; align-items: flex-start; gap: 8px; padding: 12px 13px 8px; }
  .card-title { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; line-height: 1.4; letter-spacing: -.005em; word-break: break-word; }
  .card-title .untitled { color: var(--faint); font-weight: 500; }
  .card-tools { display: flex; gap: 1px; opacity: 0; transition: opacity .15s; }
  .card:hover .card-tools, .card:focus-within .card-tools { opacity: 1; }
  .mini {
    display: grid; place-items: center; width: 26px; height: 26px;
    border: none; background: none; color: var(--faint); border-radius: 4px;
    transition: color .12s, background .12s;
  }
  .mini:hover { color: var(--ink); background: var(--surface-2); }
  .mini.del:hover { color: var(--danger); background: var(--danger-soft); }
  .grip {
    display: grid; place-items: center; flex-shrink: 0;
    width: 18px; height: 20px; margin: 0 1px 0 -3px;
    color: var(--faint); cursor: grab; border-radius: 4px;
    opacity: .45; transition: opacity .12s, color .12s, background .12s;
  }
  .card:hover .grip { opacity: 1; }
  .grip:hover { color: var(--ink); background: var(--surface-2); }
  .grip:active { cursor: grabbing; }

  .meta-row { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 13px 10px; }
  .lang {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px;
  }
  .lang .pip { width: 5px; height: 5px; border-radius: 1px; background: var(--accent); }
  .tag {
    display: inline-flex; align-items: center;
    font-size: 11px; color: var(--muted);
    background: none; border: 1px solid var(--line-2); border-radius: 20px; padding: 1px 7px;
    transition: color .12s, border-color .12s;
  }
  .tag::before { content: "#"; color: var(--faint); margin-right: 1px; }
  button.tag:hover { color: var(--accent-ink); border-color: var(--accent); }
  .proj-chip {
    display: inline-flex; align-items: center;
    font-size: 11px; color: var(--muted); background: none;
    border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 7px;
    transition: color .12s, border-color .12s;
  }
  button.proj-chip:hover { color: var(--accent-ink); border-color: var(--accent); }

  .leak {
    display: flex; align-items: flex-start; gap: 7px;
    margin: 0 13px 10px; padding: 7px 9px;
    background: var(--danger-soft); color: var(--danger-ink);
    border: 1px solid color-mix(in srgb, var(--danger) 34%, transparent);
    border-radius: 5px; font-family: var(--sans); font-size: 12px; line-height: 1.45;
  }
  .leak svg { flex-shrink: 0; margin-top: 1px; color: var(--danger); }
  .leak b { font-weight: 700; }
  .leak.in-form { margin: -3px 0 0; }

  .card-notes {
    padding: 0 13px 10px; font-family: var(--sans);
    color: var(--ink-2); font-size: 13px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }

  .code-wrap { position: relative; margin: 0 11px 11px; }
  .copy {
    position: absolute; top: 7px; right: 7px; z-index: 2;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 4px;
    border: 1px solid var(--line-2); background: var(--surface); color: var(--muted);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    opacity: 0; transition: opacity .15s, color .12s, border-color .12s;
  }
  .code-wrap:hover .copy, .copy.done, .copy:focus-visible { opacity: 1; }
  .copy:hover { color: var(--ink); border-color: var(--line-2); }
  .copy.done { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }

  pre.code {
    margin: 0; padding: 12px;
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: 5px;
    overflow: auto;
    max-height: 210px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
    tab-size: 2; color: var(--ink);
  }
  pre.code code { font-family: inherit; white-space: pre; }
  .fade-more {
    position: absolute; left: 1px; right: 1px; bottom: 1px; height: 34px;
    border-radius: 0 0 5px 5px; pointer-events: none;
    background: linear-gradient(to bottom, transparent, var(--sunken) 85%);
  }
  .card-foot {
    margin-top: auto; padding: 0 13px 11px;
    display: flex; align-items: center; gap: 8px;
    color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums;
  }
  .card-foot .open-hint { margin-left: auto; color: var(--faint); opacity: 0; transition: opacity .15s; }
  .card:hover .card-foot .open-hint { opacity: 1; }

  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-string  { color: var(--tok-string); }
  .tok-keyword { color: var(--tok-keyword); font-weight: 600; }
  .tok-number  { color: var(--tok-number); }

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="16"/></svg>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ---------- Storage ----------
  var KEY_SNIPS = "stash.snippets.v1";
  var KEY_PROJS = "stash.projects.v1";
  var KEY_THEME = "stash.theme.v1";
  var KEY_SORT  = "stash.sort.v1";
  var KEY_VIEW  = "stash.view.v1";
  var KEY_COLORS = "stash.colors.v1";

  function load(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); }
    catch (e) { toast("Could not save — browser storage may be full or blocked."); }
  }

  function normalize(s) {
    if (!s || typeof s !== "object") return null;
    var now = Date.now();
    return {
      id: typeof s.id === "string" && s.id ? s.id : uid(),
      title: typeof s.title === "string" ? s.title : "",
      project: typeof s.project === "string" ? s.project : "",
      language: typeof s.language === "string" && s.language ? s.language : "plaintext",
      code: typeof s.code === "string" ? s.code : "",
      notes: typeof s.notes === "string" ? s.notes : "",
      tags: cleanTags(Array.isArray(s.tags) ? s.tags.join(",") : (typeof s.tags === "string" ? s.tags : "")),
      todos: cleanTodos(s.todos),
      createdAt: typeof s.createdAt === "number" ? s.createdAt : now,
      updatedAt: typeof s.updatedAt === "number" ? s.updatedAt : (typeof s.createdAt === "number" ? s.createdAt : now)
    };
  }

  var snippets = (load(KEY_SNIPS, []) || []).map(normalize).filter(Boolean);
  var projects = (load(KEY_PROJS, []) || []).filter(function (p) { return typeof p === "string" && p; });

  var activeProject = "__all__";
  var activeTag = null;
  var query = "";
  var sortMode = load(KEY_SORT, "updated");
  var viewMode = load(KEY_VIEW, "cards");
  if (["updated", "created", "title", "language"].indexOf(sortMode) === -1) sortMode = "updated";
  if (viewMode !== "cards" && viewMode !== "list") viewMode = "cards";

  var editingId = null;
  var visibleOrder = [];   // ids in the order they appear on screen — drives reader prev/next

  function uid() { return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function persist() { save(KEY_SNIPS, snippets); save(KEY_PROJS, projects); }
  function byId(id) { return snippets.find(function (s) { return s.id === id; }); }

  // ============================================================
  // Colours — 13 editable base colours per mode; everything else
  // is derived so any palette stays readable.
  // ============================================================
  var BASE_KEYS = ["ground","surface","sunken","ink","line","accent","danger","mark",
                   "tok-keyword","tok-string","tok-number","tok-comment","tok-punct"];
  var SWATCH_GROUPS = [
    { name: "Surfaces", keys: [["ground","Page"],["surface","Cards & panels"],["sunken","Code / notes block"]] },
    { name: "Text & lines", keys: [["ink","Text"],["line","Borders"]] },
    { name: "Accents", keys: [["accent","Accent"],["danger","Delete & warnings"],["mark","Search highlight"]] },
    { name: "Syntax", keys: [["tok-keyword","Keywords"],["tok-string","Strings"],["tok-number","Numbers"],["tok-comment","Comments"],["tok-punct","Punctuation"]] }
  ];

  var PRESETS = {
    "Drafting table": {
      light: { ground:"#E7EBF2", surface:"#FBFCFE", sunken:"#F1F4F9", ink:"#151A23", line:"#D8DDE7",
               accent:"#57680F", danger:"#A93A2B", mark:"#F7D98B",
               "tok-keyword":"#8A3A6B", "tok-string":"#2C6B4B", "tok-number":"#A4551A", "tok-comment":"#7C8697", "tok-punct":"#6B7488" },
      dark:  { ground:"#0E1218", surface:"#161B22", sunken:"#10151B", ink:"#E3E8F0", line:"#242C36",
               accent:"#B7C95A", danger:"#EE8375", mark:"#6A5217",
               "tok-keyword":"#DC9AC7", "tok-string":"#86D0A4", "tok-number":"#E8A46A", "tok-comment":"#6E7887", "tok-punct":"#96A0B0" }
    },
    "Blueprint": {
      light: { ground:"#E4EAF4", surface:"#FAFCFF", sunken:"#EEF2FA", ink:"#101828", line:"#D2DBEA",
               accent:"#2743C8", danger:"#B3372C", mark:"#FFDE9B",
               "tok-keyword":"#6B3FBF", "tok-string":"#1F6B6B", "tok-number":"#A85418", "tok-comment":"#7A87A0", "tok-punct":"#6A7690" },
      dark:  { ground:"#0A0F1A", surface:"#111827", sunken:"#0C1220", ink:"#DEE6F5", line:"#1E2A40",
               accent:"#8CA4FF", danger:"#F08579", mark:"#5C4A16",
               "tok-keyword":"#B9A0FF", "tok-string":"#7FD4D4", "tok-number":"#E9A76B", "tok-comment":"#6B7794", "tok-punct":"#8B97B2" }
    },
    "Amber terminal": {
      light: { ground:"#EFE9DD", surface:"#FBF7EF", sunken:"#F3EDE1", ink:"#1D1810", line:"#DED5C4",
               accent:"#A05E06", danger:"#A6382A", mark:"#F6D896",
               "tok-keyword":"#8C3B5E", "tok-string":"#4C6B21", "tok-number":"#9A5A12", "tok-comment":"#8B8272", "tok-punct":"#7A7264" },
      dark:  { ground:"#100D08", surface:"#1A160F", sunken:"#13100A", ink:"#EFE6D4", line:"#2A241A",
               accent:"#E8A93B", danger:"#EF8A70", mark:"#5E4712",
               "tok-keyword":"#E39BB4", "tok-string":"#A8C46B", "tok-number":"#F0B968", "tok-comment":"#7C7261", "tok-punct":"#948A76" }
    },
    "Rosewood": {
      light: { ground:"#F1E9E9", surface:"#FDFAFA", sunken:"#F5EDEE", ink:"#221419", line:"#E4D5D8",
               accent:"#8E2F52", danger:"#A83A2B", mark:"#F8D9A8",
               "tok-keyword":"#7A3A96", "tok-string":"#3A6B4E", "tok-number":"#A65A1D", "tok-comment":"#938186", "tok-punct":"#85757A" },
      dark:  { ground:"#140E11", surface:"#1D1418", sunken:"#170F13", ink:"#F0E2E6", line:"#2E2027",
               accent:"#E58AA8", danger:"#F0857A", mark:"#61451B",
               "tok-keyword":"#C89BE8", "tok-string":"#8FD1A7", "tok-number":"#EBA470", "tok-comment":"#8A757C", "tok-punct":"#9C888F" }
    },
    "Slate": {
      light: { ground:"#ECEDEF", surface:"#FCFCFD", sunken:"#F3F4F6", ink:"#16181C", line:"#DBDDE1",
               accent:"#3A6AA8", danger:"#A33B31", mark:"#F5DA95",
               "tok-keyword":"#6A5AA8", "tok-string":"#3F6B56", "tok-number":"#96602A", "tok-comment":"#868A93", "tok-punct":"#71757E" },
      dark:  { ground:"#101113", surface:"#191B1F", sunken:"#131518", ink:"#E6E8EC", line:"#262930",
               accent:"#7FAAE0", danger:"#EC8478", mark:"#5D4C1C",
               "tok-keyword":"#A99AE8", "tok-string":"#8CC9AA", "tok-number":"#DDA472", "tok-comment":"#767A85", "tok-punct":"#8D919B" }
    }
  };
  var DEFAULT_PRESET = "Drafting table";

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isHex(v) { return typeof v === "string" && /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()); }
  function parseHex(v) {
    var h = String(v).trim().replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function toHex(rgb) {
    return "#" + rgb.map(function (n) {
      var c = Math.max(0, Math.min(255, Math.round(n))).toString(16);
      return c.length === 1 ? "0" + c : c;
    }).join("").toUpperCase();
  }
  // t = how much of `a` survives, matching color-mix(in srgb, a t%, b)
  function mix(a, b, t) { return [0, 1, 2].map(function (i) { return a[i] * t + b[i] * (1 - t); }); }
  function lum(rgb) {
    var c = rgb.map(function (v) {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contrast(a, b) {
    var x = lum(a), y = lum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }
  function bestOn(bg) {
    var white = [255, 255, 255], black = [10, 13, 18];
    return toHex(contrast(white, bg) >= contrast(black, bg) ? white : black);
  }
  // Nudge a colour toward --shade until it reads on the given background.
  function inkOn(base, bg, shade) {
    var steps = [0.8, 0.68, 0.56, 0.44, 0.32, 0.2, 0.1, 0];
    for (var i = 0; i < steps.length; i++) {
      var c = mix(base, shade, steps[i]);
      if (contrast(c, bg) >= 4.5) return toHex(c);
    }
    return toHex(shade);
  }
  function rgba(rgb, a) { return "rgba(" + rgb.map(Math.round).join(",") + "," + a + ")"; }

  function resolvePalette(base) {
    var g = parseHex(base.ground), su = parseHex(base.surface), ink = parseHex(base.ink),
        line = parseHex(base.line), acc = parseHex(base.accent), dan = parseHex(base.danger), mk = parseHex(base.mark);
    var isDark = lum(su) < 0.35;
    var shade = isDark ? [255, 255, 255] : [8, 11, 17];
    var accSoft = mix(acc, su, 0.15), danSoft = mix(dan, su, 0.15);

    var out = {};
    BASE_KEYS.forEach(function (k) { out[k] = base[k]; });
    out["shade"]       = toHex(shade);
    out["surface-2"]   = toHex(mix(su, shade, 0.94));
    out["ink-2"]       = toHex(mix(ink, g, 0.86));
    out["muted"]       = toHex(mix(ink, g, 0.64));
    out["faint"]       = toHex(mix(ink, g, 0.44));
    out["line-2"]      = toHex(mix(line, shade, 0.82));
    out["accent-hi"]   = toHex(mix(acc, shade, 0.85));
    out["accent-soft"] = toHex(accSoft);
    out["accent-ink"]  = inkOn(acc, accSoft, shade);
    out["danger-soft"] = toHex(danSoft);
    out["danger-ink"]  = inkOn(dan, danSoft, shade);
    out["mark-bg"]     = base.mark;
    out["mark-ink"]    = inkOn(mk, mk, shade);
    out["mark-ring"]   = toHex(mix(mk, shade, 0.68));
    out["grid"]        = rgba(shade, isDark ? 0.05 : 0.06);
    out["scrim"]       = isDark ? "rgba(4,6,10,.66)" : "rgba(12,16,24,.52)";
    out["on-accent"]   = bestOn(acc);
    out["on-danger"]   = bestOn(dan);
    out["on-ink"]      = bestOn(ink);
    out["shadow"]      = isDark
      ? "0 1px 1px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.72)"
      : "0 1px 1px rgba(21,26,35,.04), 0 6px 20px -12px rgba(21,26,35,.28)";
    out["shadow-lift"] = isDark
      ? "0 2px 5px rgba(0,0,0,.5), 0 26px 54px -24px rgba(0,0,0,.82)"
      : "0 2px 3px rgba(21,26,35,.07), 0 22px 48px -22px rgba(21,26,35,.38)";
    return out;
  }

  function validPalette(raw) {
    var def = PRESETS[DEFAULT_PRESET];
    var out = { light: {}, dark: {} };
    ["light", "dark"].forEach(function (mode) {
      BASE_KEYS.forEach(function (k) {
        var v = raw && raw[mode] && raw[mode][k];
        out[mode][k] = isHex(v) ? v.trim().toUpperCase() : def[mode][k];
      });
    });
    return out;
  }

  var palette = validPalette(load(KEY_COLORS, null));

  var paletteStyle = null;
  function paintPalette() {
    if (!paletteStyle) {
      paletteStyle = document.createElement("style");
      paletteStyle.id = "paletteCSS";
      document.body.appendChild(paletteStyle); // after the main <style>, so these win
    }
    function block(sel, mode) {
      var t = resolvePalette(palette[mode]);
      return sel + "{" + Object.keys(t).map(function (k) { return "--" + k + ":" + t[k] + ";"; }).join("") + "}";
    }
    paletteStyle.textContent =
      block(":root", "light") +
      '@media (prefers-color-scheme: dark){' + block(':root:not([data-theme="light"])', "dark") + "}" +
      block(':root[data-theme="dark"]', "dark") +
      block(':root[data-theme="light"]', "light");
  }
  paintPalette();

  // ---------- Tags ----------
  function cleanTags(raw) {
    var seen = {}, out = [];
    String(raw || "").split(/[,\n]/).forEach(function (t) {
      var v = t.trim().replace(/^#/, "").slice(0, 24);
      if (!v) return;
      var k = v.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1; out.push(v);
    });
    return out.slice(0, 10);
  }
  function tagIndex() {
    var map = {}, order = [];
    snippets.forEach(function (s) {
      s.tags.forEach(function (t) {
        var k = t.toLowerCase();
        if (!map[k]) { map[k] = { label: t, count: 0 }; order.push(k); }
        map[k].count++;
      });
    });
    return order.map(function (k) { return map[k]; }).sort(function (a, b) {
      if (b.count !== a.count) return b.count - a.count;
      return a.label.toLowerCase() < b.label.toLowerCase() ? -1 : 1;
    });
  }
  function hasTag(s, tag) {
    if (!tag) return true;
    var t = tag.toLowerCase();
    return s.tags.some(function (x) { return x.toLowerCase() === t; });
  }

  // ---------- Next steps ----------
  function cleanTodos(raw) {
    if (!Array.isArray(raw)) return [];
    var out = [];
    raw.forEach(function (t) {
      var text = typeof t === "string" ? t : (t && typeof t.text === "string" ? t.text : "");
      text = text.trim().slice(0, 200);
      if (!text) return;
      out.push({
        id: (t && typeof t.id === "string" && t.id) ? t.id : uid(),
        text: text,
        done: !!(t && t.done),
        createdAt: (t && typeof t.createdAt === "number") ? t.createdAt : Date.now(),
        doneAt: (t && typeof t.doneAt === "number") ? t.doneAt : null
      });
    });
    return out.slice(0, 50);
  }
  function openSteps(s) { return s.todos.filter(function (t) { return !t.done; }); }
  function totalOpenSteps() {
    return snippets.reduce(function (n, s) { return n + openSteps(s).length; }, 0);
  }
  // One step per line. "[x] " marks a line done, and lines that survive an edit
  // keep the state they already had.
  function todosFromText(text, existing) {
    var prior = {};
    (existing || []).forEach(function (t) {
      var k = t.text.toLowerCase();
      if (!prior[k]) prior[k] = t;
    });
    var out = [];
    String(text || "").split("\n").forEach(function (line) {
      var raw = line.trim().replace(/^[-*\u2022]\s*/, "");
      var marked = /^\[[xX]\]\s*/.test(raw);
      var v = raw.replace(/^\[[ xX]\]\s*/, "").trim().slice(0, 200);
      if (!v) return;
      var prev = prior[v.toLowerCase()];
      out.push({
        id: prev ? prev.id : uid(),
        text: v,
        done: marked || (prev ? prev.done : false),
        createdAt: prev ? prev.createdAt : Date.now(),
        doneAt: prev ? prev.doneAt : null
      });
    });
    return out.slice(0, 50);
  }
  function todosToText(todos) {
    return todos.map(function (t) { return (t.done ? "[x] " : "") + t.text; }).join("\n");
  }

  function touchSteps(sid, focusSel) {
    var s = byId(sid);
    if (s) s.updatedAt = Date.now();
    persist();
    render();
    if (readerEl && readerId === sid) paintReader();
    if (focusSel) {
      var el = document.querySelector(focusSel);
      if (el) el.focus();
    }
  }
  function addStep(sid, text) {
    var s = byId(sid);
    if (!s || !text) return;
    if (s.todos.length >= 50) { toast("That is 50 next steps — plenty for one note"); return; }
    s.todos.push({ id: uid(), text: text.slice(0, 200), done: false, createdAt: Date.now(), doneAt: null });
    touchSteps(sid, readerEl ? ".reader .steps-add input" : '.steps-add input[data-sid="' + sid + '"]');
  }
  function toggleStep(sid, tid) {
    var s = byId(sid);
    if (!s) return;
    var t = s.todos.find(function (x) { return x.id === tid; });
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    touchSteps(sid, '.todo[data-t="' + tid + '"] .todo-box');
  }
  function removeStep(sid, tid) {
    var s = byId(sid);
    if (!s) return;
    s.todos = s.todos.filter(function (t) { return t.id !== tid; });
    touchSteps(sid, null);
  }

  var CHECK_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var BOX_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
  var X_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

  function stepFlag(s) {
    if (!s.todos.length) return "";
    var open = openSteps(s).length;
    if (!open) return '<span class="todo-flag all-done">' + CHECK_ICON + "steps done</span>";
    return '<span class="todo-flag">' + BOX_ICON + open + " next step" + (open === 1 ? "" : "s") + "</span>";
  }

  // Shared by the reader and the Next steps view.
  function stepsHtml(s, opts) {
    opts = opts || {};
    var list = opts.openOnly ? openSteps(s) : s.todos;
    var doneN = s.todos.length - openSteps(s).length;
    return (opts.heading === false ? "" :
        '<div class="steps-head"><span class="steps-title">Next steps</span>' +
        (s.todos.length ? '<span class="steps-count">' + doneN + " of " + s.todos.length + " done</span>" : "") +
        "</div>") +
      '<ul class="steps-list" data-sid="' + s.id + '">' +
        list.map(function (t) {
          return '<li class="todo' + (t.done ? " on" : "") + '" data-t="' + t.id + '">' +
            '<button class="todo-box" aria-pressed="' + (t.done ? "true" : "false") +
              '" aria-label="' + (t.done ? "Mark as not done" : "Mark done") + '">' + CHECK_ICON + "</button>" +
            '<span class="todo-text">' + markText(t.text, query) + "</span>" +
            '<button class="todo-del" aria-label="Remove this step">' + X_ICON + "</button>" +
            "</li>";
        }).join("") +
      "</ul>" +
      '<div class="steps-add">' +
        '<input type="text" data-sid="' + s.id + '" maxlength="200" placeholder="Add a next step…" aria-label="Add a next step">' +
        "<button>Add</button>" +
      "</div>";
  }

  function wireSteps(root) {
    root.querySelectorAll(".steps-list").forEach(function (ul) {
      ul.addEventListener("click", function (e) {
        var sid = ul.getAttribute("data-sid");
        var box = e.target.closest(".todo-box");
        if (box) { toggleStep(sid, box.parentNode.getAttribute("data-t")); return; }
        var del = e.target.closest(".todo-del");
        if (del) removeStep(sid, del.parentNode.getAttribute("data-t"));
      });
    });
    root.querySelectorAll(".steps-add").forEach(function (bar) {

  // ---------- Languages ----------

  function cComment() { return "\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/"; }
  function langConfig(lang) {

      case "python": c.commentSrc = "#[^\\n]*"; c.kw = KW.python; break;
      case "yaml": c.commentSrc = "#[^\\n]*"; break;

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  // Escape text and wrap search hits in <mark>. Operates on raw text.
  function markText(raw, q) {
    if (!q) return esc(raw);
    var lower = String(raw).toLowerCase(), ql = q.toLowerCase();
    var out = "", i = 0, idx;
    while ((idx = lower.indexOf(ql, i)) !== -1) {
      out += esc(raw.slice(i, idx)) + '<mark class="hl">' + esc(raw.slice(idx, idx + ql.length)) + "</mark>";
      i = idx + ql.length;
    }
    return out + esc(raw.slice(i));
  }

  // Syntax highlighter — single-pass tokenizer, no external libs.
  // Every emitted text chunk goes through markText so search hits show inside code too.
  function highlight(code, lang, q) {
    var cfg = langConfig(lang);
    var entries = [];
    if (cfg.commentSrc) entries.push({ name: "comment", src: cfg.commentSrc });
    entries.push({ name: "string", src: "\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'|`(?:\\\\.|[^`\\\\])*`" });
    entries.push({ name: "number", src: "\\b0[xX][0-9a-fA-F]+\\b|\\b\\d[\\d_]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?\\b" });
    if (cfg.kw && cfg.kw.length) entries.push({ name: "keyword", src: "\\b(?:" + cfg.kw.join("|") + ")\\b" });
    entries.push({ name: "punct", src: "[{}()\\[\\];,]" });

    var combined;
    try {
      combined = new RegExp(entries.map(function (e) { return "(" + e.src + ")"; }).join("|"), "g");
    } catch (e) { return markText(code, q); }

    var out = "", last = 0, m;
    while ((m = combined.exec(code)) !== null) {
      if (m.index > last) out += markText(code.slice(last, m.index), q);
      var cls = null;
      for (var i = 0; i < entries.length; i++) { if (m[i + 1] !== undefined) { cls = entries[i].name; break; } }
      out += '<span class="tok-' + cls + '">' + markText(m[0], q) + "</span>";
      last = m.index + m[0].length;
      if (m[0].length === 0) combined.lastIndex++;
    }
    if (last < code.length) out += markText(code.slice(last), q);
    return out;
  }

  // ---------- Secret detection ----------
  // Conservative — well-known credential shapes only, so ordinary code never nags.
  var SECRET_PATTERNS = [
    { name: "GitHub token", re: /\b(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/ },
    { name: "Anthropic key", re: /\bsk-ant-[A-Za-z0-9_-]{18,}\b/ },
    { name: "OpenAI key", re: /\bsk-(?!ant-)(?:proj-)?[A-Za-z0-9_-]{20,}\b/ },
    { name: "AWS access key", re: /\bAKIA[0-9A-Z]{16}\b/ },
    { name: "Google API key", re: /\bAIza[0-9A-Za-z_-]{35}\b/ },
    { name: "Slack token", re: /\bxox[baprs]-[A-Za-z0-9-]{10,}\b/ },
    { name: "Stripe key", re: /\b[rs]k_live_[0-9a-zA-Z]{16,}\b/ },
    { name: "JWT", re: /\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{6,}\b/ },

  function detectSecrets(text) {
    if (!text) return [];
    var found = [];
    SECRET_PATTERNS.forEach(function (p) {

  }
  function secretsIn(s) { return detectSecrets((s.code || "") + "\n" + (s.notes || "")); }
  var WARN_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

  // ---------- Dates ----------
  function relDate(ts) {
    var diff = (Date.now() - ts) / 1000;
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    if (diff < 172800) return "yesterday";
    if (diff < 604800) return Math.floor(diff / 86400) + "d ago";
    var d = new Date(ts), now = new Date();
    var opts = { month: "short", day: "numeric" };

    return d.toLocaleDateString(undefined, opts);
  }

  // ---------- Filtering & sorting ----------
