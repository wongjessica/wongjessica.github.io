        '<div class="code-wrap">' +
          '<button class="copy" title="Copy">' + COPY_ICON + '<span>Copy</span></button>' +
          '<pre class="code"><code>' + highlight(s.code || "", s.language, query) + '</code></pre>' +
          (tall ? '<span class="fade-more"></span>' : "") +
        '</div>' +
        '<div class="card-foot"><span>' + lines + ' line' + (lines === 1 ? "" : "s") + ' · updated ' + relDate(s.updatedAt) +
          '</span><span class="open-hint">Open ↗</span></div>' +
      '</article>';
  }

  function rowHtml(s) {
    var firstLine = (s.code || "").split("\n").find(function (l) { return l.trim(); }) || "";
    var leaks = secretsIn(s);
    return '' +
      '<div class="row" data-id="' + s.id + '" tabindex="0" role="button" aria-label="Open ' + escAttr(s.title || "Untitled") + '">' +
        GRIP +
        '<span class="row-main">' +
          '<span class="row-title">' + titleHtml(s) + '</span>' +
          '<span class="row-peek">' + markText(firstLine.trim().slice(0, 120), query) + '</span>' +
        '</span>' +
        '<span class="row-meta">' +
          (leaks.length ? '<span class="leak-pip" title="Possible ' + escAttr(leaks[0]) + '">' + WARN_ICON + '</span>' : "") +
          stepFlag(s) +
          tagChips(s, true) +
          '<span class="lang"><span class="pip"></span>' + esc(langLabel(s)) + '</span>' +
          '<span class="row-when">' + relDate(s.updatedAt) + '</span>' +
          '<span class="row-tools">' +
            '<button class="mini copy-row" title="Copy" aria-label="Copy">' + COPY_ICON + '</button>' +
            '<button class="mini edit" title="Edit" aria-label="Edit">' + EDIT_ICON + '</button>' +
            '<button class="mini del" title="Delete" aria-label="Delete">' + DEL_ICON + '</button>' +
          '</span>' +
        '</span>' +
      '</div>';
  }

  function wireItems() {
    workspace.querySelectorAll(".card, .row").forEach(function (el) {
      var id = el.getAttribute("data-id");
      var snip = byId(id);
      if (!snip) return;

      el.addEventListener("click", function (e) {
        if (e.target.closest("button")) return;
        openReader(id);
      });
      el.addEventListener("keydown", function (e) {
        if (e.target !== el) return;
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openReader(id); }
      });

      el.querySelector(".edit").addEventListener("click", function () { openForm(snip); });
      el.querySelector(".del").addEventListener("click", function () { askDelete(snip); });

      var copyBtn = el.querySelector(".copy") || el.querySelector(".copy-row");
      if (copyBtn) copyBtn.addEventListener("click", function () { copyCode(snip, copyBtn); });

      el.querySelectorAll(".tag").forEach(function (chip) {
        chip.addEventListener("click", function () { toggleTag(chip.getAttribute("data-tag")); });
      });

      var grip = el.querySelector(".grip");
      grip.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", id);
        e.dataTransfer.effectAllowed = "move";
        el.classList.add("dragging");
        try { e.dataTransfer.setDragImage(el, 24, 18); } catch (err) {}
      });
      grip.addEventListener("dragend", function () {
        el.classList.remove("dragging");
        document.querySelectorAll(".nav-item.drop-on").forEach(function (n) { n.classList.remove("drop-on"); });
      });
    });
  }

  // Move a snippet to a project ("" means Unfiled). Creates the project if it is new.
  function moveSnippet(id, proj) {
    var s = byId(id);
    if (!s) return;
    if ((s.project || "") === (proj || "")) { toast("Already in " + (proj ? "“" + proj + "”" : "Unfiled")); return; }
    s.project = proj || "";
    s.updatedAt = Date.now();
    if (proj && projects.indexOf(proj) === -1) projects.push(proj);
    persist(); render();
    toast(proj ? "Moved to “" + proj + "”" : "Moved to Unfiled");
  }
  function addDropTarget(el, getProj) {
    el.addEventListener("dragover", function (e) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; el.classList.add("drop-on"); });
    el.addEventListener("dragleave", function (e) { if (!el.contains(e.relatedTarget)) el.classList.remove("drop-on"); });
    el.addEventListener("drop", function (e) {
      e.preventDefault(); el.classList.remove("drop-on");
      var id = e.dataTransfer.getData("text/plain");
      if (id) moveSnippet(id, typeof getProj === "function" ? getProj() : getProj);
    });
  }

  function emptyState() {
    if (query || activeTag) {
      var what = query ? '“' + esc(query) + '”' : "#" + esc(activeTag);
      return '<div class="empty"><div class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>' +
        '<h2>No matches</h2><p class="prose">Nothing here matches ' + what + '. Try a different word, or clear the filter above.</p></div>';
    }
    var where = activeProject === "__all__" ? "your stash" : '“' + esc(activeProject) + '”';
    return '<div class="empty"><div class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>' +
      '<h2>Nothing filed yet</h2><p class="prose">Add your first snippet to ' + where + '. Paste code or just dump what you are thinking about, tag it, and jot a note so future-you remembers why it mattered.</p>' +
      '<button class="btn" id="emptyNew"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New snippet</button></div>';
  }
  function wireEmpty() {
    var b = document.getElementById("emptyNew");
    if (b) b.addEventListener("click", function () { openForm(null); });
  }

  // ---------- Copy ----------
  function copyCode(snip, btn) {
    var text = snip.code || "";
    var span = btn.querySelector("span");
    var prev = span ? span.textContent : "";
    var done = function () {
      btn.classList.add("done");
      if (span) span.textContent = "Copied";
      setTimeout(function () { btn.classList.remove("done"); if (span) span.textContent = prev; }, 1400);
      if (!span) toast("Copied");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else { fallbackCopy(text, done); }
  }
  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); }
    catch (e) { toast("Copy failed — select the text and copy manually."); }
    document.body.removeChild(ta);
  }

  // ---------- Ask dialog (native confirm() is blocked in sandboxed frames) ----------
  // actions: [{ label, kind: "" | "warn" | "quiet", run }]
  function ask(title, bodyHtml, actions) {
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML =
      '<div class="sheet ask" role="alertdialog" aria-modal="true">' +
        '<div class="sheet-body ask-body">' +
          '<div class="ask-title">' + esc(title) + '</div>' +
          '<div class="ask-text">' + bodyHtml + '</div>' +
        '</div>' +
        '<div class="sheet-foot"><span class="gap"></span>' +
          '<button class="btn quiet" data-i="-1">Cancel</button>' +
          actions.map(function (a, i) {
            return '<button class="btn ' + (a.kind || "") + '" data-i="' + i + '">' + esc(a.label) + "</button>";
          }).join("") +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    var close = function () { ov.remove(); document.removeEventListener("keydown", onKey); };
    function onKey(e) { if (e.key === "Escape") { e.preventDefault(); close(); } }
    document.addEventListener("keydown", onKey);
    ov.addEventListener("mousedown", function (e) { if (e.target === ov) close(); });
    ov.querySelectorAll(".sheet-foot button").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        close();
        if (i >= 0) actions[i].run();
      });
    });
    var last = ov.querySelector('.sheet-foot button[data-i="' + (actions.length - 1) + '"]');
    if (last) last.focus();
  }

  function askDelete(snip) {
    ask("Delete snippet?",
      'This permanently deletes <b>“' + esc(snip.title || "Untitled") + '”</b>. It can’t be undone.',
      [{ label: "Delete", kind: "warn", run: function () {
        snippets = snippets.filter(function (s) { return s.id !== snip.id; });
        persist();
        if (readerEl) closeReader();
        render(); toast("Snippet deleted");
      } }]);
  }

  // ---------- Reader (full view) ----------
  var readerEl = null, readerId = null, readerSoft = false;

  function openReader(id) {
    readerId = id;
    if (readerEl) { paintReader(); return; }
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = '<div class="reader" role="dialog" aria-modal="true" aria-label="Snippet"></div>';
    document.body.appendChild(ov);
    readerEl = ov;
    ov.addEventListener("mousedown", function (e) { if (e.target === ov) closeReader(); });
    document.addEventListener("keydown", readerKeys);
    paintReader();
  }
  function closeReader() {
    if (!readerEl) return;
    readerEl.remove(); readerEl = null; readerId = null;
    document.removeEventListener("keydown", readerKeys);
  }
  function readerKeys(e) {
    if (!readerEl) return;
    if (document.querySelectorAll(".overlay").length > 1) return; // a form/dialog is on top
    if (e.key === "Escape") { e.preventDefault(); closeReader(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); stepReader(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); stepReader(-1); }
  }
  function stepReader(dir) {
    var i = visibleOrder.indexOf(readerId);
    if (i === -1) return;
    var next = i + dir;
    if (next < 0 || next >= visibleOrder.length) return;
    readerId = visibleOrder[next];
    paintReader();
  }

  function paintReader() {
    var s = byId(readerId);
    if (!s) { closeReader(); return; }
    var box = readerEl.querySelector(".reader");
    var idx = visibleOrder.indexOf(readerId);
    var lines = (s.code || "").split("\n");
    var leaks = secretsIn(s);
    var gutter = lines.map(function (_, i) { return i + 1; }).join("\n");

    box.innerHTML =
      '<div class="reader-head">' +
        '<div class="reader-id">' +
          '<h2>' + titleHtml(s) + '</h2>' +
          '<div class="reader-meta">' +
            '<span class="lang"><span class="pip"></span>' + esc(langLabel(s)) + '</span>' +
            (s.project ? '<button class="proj-chip" id="rProj" title="Show this project">' + esc(s.project) + '</button>' : '<span class="proj-chip">Unfiled</span>') +
            tagChips(s, true) +
            '<span class="reader-when">Created ' + absDate(s.createdAt) + ' · updated ' + relDate(s.updatedAt) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="reader-acts">' +
          '<div class="step">' +
            '<button id="rPrev" title="Previous (←)" aria-label="Previous snippet"' + (idx <= 0 ? " disabled" : "") + '><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>' +
            '<span class="pos">' + (idx >= 0 ? (idx + 1) + " / " + visibleOrder.length : "—") + '</span>' +
            '<button id="rNext" title="Next (→)" aria-label="Next snippet"' + (idx === -1 || idx >= visibleOrder.length - 1 ? " disabled" : "") + '><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>' +
          '</div>' +
          '<button class="btn quiet" id="rCopy">' + COPY_ICON + '<span>Copy</span></button>' +
          '<button class="icon-btn" id="rEdit" title="Edit" aria-label="Edit">' + EDIT_ICON + '</button>' +
          '<button class="icon-btn" id="rDel" title="Delete" aria-label="Delete">' + DEL_ICON + '</button>' +
          '<button class="icon-btn" id="rClose" title="Close (Esc)" aria-label="Close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
        '</div>' +
      '</div>' +
      '<div class="reader-body">' +
        (leaks.length ? '<div class="leak">' + WARN_ICON + '<span>Possible <b>' + esc(leaks.join(", ")) + '</b> in this snippet. Keep the real value in a password manager and store a placeholder instead.</span></div>' : "") +
        '<div class="steps">' + stepsHtml(s) + "</div>" +
        (s.notes ? '<div class="reader-notes">' + markText(s.notes, query) + "</div>" : "") +
        '<div class="reader-pane">' +
          '<div class="pane-bar">' +
            '<span class="stat">' + lines.length + ' line' + (lines.length === 1 ? "" : "s") + ' · ' + (s.code || "").length + ' chars</span>' +
            '<span class="gap"></span>' +
            '<button class="toggle" id="rWrap" aria-pressed="' + (readerSoft ? "true" : "false") + '" title="Soft-wrap long lines (hides line numbers)">Wrap</button>' +
          '</div>' +
          '<div class="reader-code' + (readerSoft ? " soft" : "") + '" id="rCode">' +
            '<pre class="gutter" aria-hidden="true">' + gutter + '</pre>' +
            '<pre class="src"><code>' + highlight(s.code || "", s.language, query) + '</code></pre>' +
          '</div>' +
        '</div>' +
      '</div>';

    wireSteps(box);
    box.querySelector("#rClose").addEventListener("click", closeReader);
    box.querySelector("#rPrev").addEventListener("click", function () { stepReader(-1); });
    box.querySelector("#rNext").addEventListener("click", function () { stepReader(1); });
    var cp = box.querySelector("#rCopy");
    cp.addEventListener("click", function () { copyCode(s, cp); });
    box.querySelector("#rEdit").addEventListener("click", function () { openForm(s, true); });
    box.querySelector("#rDel").addEventListener("click", function () { askDelete(s); });
    box.querySelector("#rWrap").addEventListener("click", function () {
      readerSoft = !readerSoft;
      this.setAttribute("aria-pressed", readerSoft ? "true" : "false");
      box.querySelector("#rCode").classList.toggle("soft", readerSoft);
    });
    var rp = box.querySelector("#rProj");
    if (rp) rp.addEventListener("click", function () { closeReader(); selectProject(s.project); });
    box.querySelectorAll(".reader-meta .tag[data-tag]").forEach(function (chip) {
      chip.addEventListener("click", function () { closeReader(); toggleTag(chip.getAttribute("data-tag")); });
    });
  }

  // ---------- Snippet form ----------
  function openForm(snip, fromReader) {
    editingId = snip ? snip.id : null;
    var isEdit = !!snip;
    var projOptions = allProjectNames().map(function (n) { return '<option value="' + escAttr(n) + '"></option>'; }).join("");
    var langOptions = LANGS.map(function (l) {
      var sel = (snip && snip.language === l) || (!snip && l === "plaintext") ? " selected" : "";
      return '<option value="' + l + '"' + sel + ">" + esc(LABEL[l]) + "</option>";
    }).join("");
    var realProject = activeProject !== "__all__" && activeProject !== "__todos__";
    var defProj = snip ? (snip.project || "") : (realProject ? activeProject : "");
    var defTags = snip ? snip.tags.join(", ") : (activeTag || "");

    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-head"><h2>' + (isEdit ? "Edit snippet" : "New snippet") + '</h2>' +
          '<button class="icon-btn" id="fClose" aria-label="Close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
        '</div>' +
        '<div class="sheet-body">' +
          '<div class="field"><label for="fTitle">Title</label>' +
            '<input class="control" id="fTitle" type="text" placeholder="e.g. Debounce hook" maxlength="120" value="' + (snip ? escAttr(snip.title) : "") + '"></div>' +
          '<div class="pair">' +
            '<div class="field"><label for="fProj">Project <span class="hint">type to create</span></label>' +
              '<input class="control" id="fProj" list="projOpts" placeholder="Unfiled" maxlength="40" value="' + escAttr(defProj) + '">' +
              '<datalist id="projOpts">' + projOptions + '</datalist></div>' +
            '<div class="field"><label for="fLang">Language</label>' +
              '<select class="control" id="fLang">' + langOptions + '</select></div>' +
          '</div>' +
          '<div class="field"><label for="fTags">Tags <span class="hint">comma-separated, up to 10</span></label>' +
            '<input class="control" id="fTags" type="text" placeholder="regex, one-liner, gotcha" value="' + escAttr(defTags) + '"></div>' +
          '<div class="field"><label for="fCode">Code / notes</label>' +
            '<textarea class="control code-input" id="fCode" placeholder="Paste code, or just start typing…" spellcheck="false">' + (snip ? esc(snip.code) : "") + '</textarea></div>' +
          '<div class="leak in-form hidden" id="fLeak">' + WARN_ICON + '<span class="leak-text"></span></div>' +
          '<div class="field"><label for="fNotes">Context <span class="hint">why it matters, gotchas, where you used it</span></label>' +
            '<textarea class="control" id="fNotes" rows="3" placeholder="Context for future-you…">' + (snip ? esc(snip.notes) : "") + '</textarea></div>' +
          '<div class="field"><label for="fSteps">Next steps <span class="hint">one per line — a line starting with [x] is already done</span></label>' +
            '<textarea class="control steps-input" id="fSteps" rows="3" placeholder="Try it against staging&#10;Ask about the rate limit">' + (snip ? esc(todosToText(snip.todos)) : "") + '</textarea></div>' +
        '</div>' +
        '<div class="sheet-foot">' +
          (isEdit ? '<button class="btn warn-quiet" id="fDelete">Delete</button>' : "") +
          '<span class="gap"></span>' +
          '<button class="btn quiet" id="fCancel">Cancel</button>' +
          '<button class="btn" id="fSave">' + (isEdit ? "Save changes" : "Save snippet") + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);

    var close = function () { ov.remove(); document.removeEventListener("keydown", onKey); };
    ov.addEventListener("mousedown", function (e) { if (e.target === ov) close(); });
    ov.querySelector("#fClose").addEventListener("click", close);
    ov.querySelector("#fCancel").addEventListener("click", close);
    var del = ov.querySelector("#fDelete");
    if (del) del.addEventListener("click", function () { close(); askDelete(snip); });

    var codeEl = ov.querySelector("#fCode");
    codeEl.addEventListener("keydown", function (e) {
      if (e.key === "Tab") {
        e.preventDefault();
        var st = this.selectionStart, en = this.selectionEnd;
        this.value = this.value.slice(0, st) + "  " + this.value.slice(en);
        this.selectionStart = this.selectionEnd = st + 2;
      }
    });

    var notesEl = ov.querySelector("#fNotes");
    var leakEl = ov.querySelector("#fLeak");
    function refreshLeak() {
      var types = detectSecrets(codeEl.value + "\n" + notesEl.value);
      if (types.length) {
        leakEl.querySelector(".leak-text").innerHTML = "Looks like a <b>" + esc(types.slice(0, 2).join(", ")) +
          "</b> is in here. Keep the real value in a password manager or keychain and store a placeholder like <b>$TOKEN</b> instead. You can still save either way.";
        leakEl.classList.remove("hidden");
      } else { leakEl.classList.add("hidden"); }
    }
    codeEl.addEventListener("input", refreshLeak);
    notesEl.addEventListener("input", refreshLeak);
    refreshLeak();

    ov.querySelector("#fSave").addEventListener("click", commit);
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); close(); }
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); commit(); }
    }
    document.addEventListener("keydown", onKey);

    var titleEl = ov.querySelector("#fTitle");
    titleEl.focus();

    function commit() {
      var title = titleEl.value.trim();
      var proj = ov.querySelector("#fProj").value.trim();
      var lang = ov.querySelector("#fLang").value;
      var tags = cleanTags(ov.querySelector("#fTags").value);
      var code = codeEl.value;
      var notes = notesEl.value.trim();
      var todos = todosFromText(ov.querySelector("#fSteps").value, snip ? snip.todos : []);

      if (!code.trim() && !title) { toast("Add a title, or something to put in it"); titleEl.focus(); return; }
      if (proj && projects.indexOf(proj) === -1) projects.push(proj);

      var savedId = editingId;
      if (editingId) {
        var s = byId(editingId);
        if (s) {
          s.title = title; s.project = proj; s.language = lang;
          s.tags = tags; s.code = code; s.notes = notes; s.todos = todos; s.updatedAt = Date.now();
        }
        toast("Changes saved");
      } else {
        var fresh = {
          id: uid(), title: title, project: proj, language: lang, tags: tags, todos: todos,
          code: code, notes: notes, createdAt: Date.now(), updatedAt: Date.now()
        };
        snippets.push(fresh);
        savedId = fresh.id;
        toast("Snippet saved");
        if (proj && realProject) activeProject = proj;
      }
      persist(); close(); render();
      if (fromReader && savedId) openReader(savedId);
    }
  }

  // ---------- Colours panel ----------
  var LOW_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

  function effectiveTheme() {
    var stamped = document.documentElement.getAttribute("data-theme");
    if (stamped === "light" || stamped === "dark") return stamped;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function openColors() {
    var editMode = effectiveTheme();

    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML =
      '<div class="sheet theme" role="dialog" aria-modal="true" aria-label="Colours">' +
        '<div class="sheet-head"><h2>Colours</h2>' +
          '<button class="icon-btn" id="cClose" aria-label="Close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
        '</div>' +
        '<div class="sheet-body">' +
          '<div class="field"><label>Editing</label>' +
            '<div class="mode-switch">' +
              '<div class="seg" role="group" aria-label="Which palette to edit">' +
                '<button data-m="light">Light</button><button data-m="dark">Dark</button>' +
              '</div>' +
              '<span class="mode-note" id="modeNote"></span>' +
            '</div>' +
          '</div>' +
          '<div class="field"><label>Start from</label><div class="presets" id="presetRow"></div></div>' +
          '<div id="swatchGroups" style="display:flex;flex-direction:column;gap:14px"></div>' +
          '<div class="field"><label>Readability <span class="hint">contrast ratio, 4.5 or higher is comfortable</span></label>' +
            '<div class="checks" id="checks"></div></div>' +
        '</div>' +
        '<div class="sheet-foot">' +
          '<button class="btn warn-quiet" id="cReset">Reset to default</button>' +
          '<span class="gap"></span>' +
          '<button class="btn" id="cDone">Done</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    var sheet = ov.querySelector(".sheet");

    var close = function () { ov.remove(); document.removeEventListener("keydown", onKey); };
    function onKey(e) { if (e.key === "Escape") { e.preventDefault(); close(); } }
    document.addEventListener("keydown", onKey);
    ov.addEventListener("mousedown", function (e) { if (e.target === ov) close(); });
    sheet.querySelector("#cClose").addEventListener("click", close);
    sheet.querySelector("#cDone").addEventListener("click", close);
    sheet.querySelector("#cReset").addEventListener("click", function () {
      palette = clone(PRESETS[DEFAULT_PRESET]);
      commitColors(); paintPanel();
      toast("Colours reset");
    });

    function commitColors() { save(KEY_COLORS, palette); paintPalette(); }

    function paintChecks() {
      var t = resolvePalette(palette[editMode]);
      var pairs = [
        ["Text on cards", t.ink, t.surface],
        ["Text on page", t.ink, t.ground],
        ["Accent on cards", t.accent, t.surface],
        ["Search highlight", t["mark-ink"], t["mark-bg"]]
      ];
      sheet.querySelector("#checks").innerHTML = pairs.map(function (p) {
        var r = contrast(parseHex(p[1]), parseHex(p[2]));
        var low = r < 4.5;
        return '<span class="check' + (low ? " low" : "") + '">' + (low ? LOW_ICON : "") +
          esc(p[0]) + ' <b class="ratio">' + r.toFixed(1) + ':1</b></span>';
      }).join("");
    }

    function paintPanel() {
      sheet.querySelectorAll(".seg button[data-m]").forEach(function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-m") === editMode ? "true" : "false");
      });
      sheet.querySelector("#modeNote").textContent = editMode === "light"
        ? "Shown to visitors whose device is set to light."
        : "Shown to visitors whose device is set to dark.";

      sheet.querySelector("#presetRow").innerHTML = Object.keys(PRESETS).map(function (name) {
        var p = PRESETS[name][editMode];
        return '<button class="preset" data-p="' + escAttr(name) + '"><span class="dots">' +
          [p.accent, p.surface, p.ink].map(function (c) {
            return '<i style="background:' + c + '"></i>';
          }).join("") + '</span>' + esc(name) + "</button>";
      }).join("");

      sheet.querySelector("#swatchGroups").innerHTML = SWATCH_GROUPS.map(function (grp) {
        return '<div class="field"><label>' + esc(grp.name) + '</label><div class="swatch-grid">' +
          grp.keys.map(function (pair) {
            var k = pair[0], v = palette[editMode][k];
            return '<div class="swatch">' +
              '<input type="color" data-k="' + k + '" value="' + v + '" aria-label="' + escAttr(pair[1]) + '">' +
              '<span class="sw-name">' + esc(pair[1]) + '</span>' +
              '<input type="text" class="sw-hex" data-k="' + k + '" value="' + v + '" spellcheck="false" maxlength="7" aria-label="' + escAttr(pair[1]) + ' hex value">' +
              '</div>';
          }).join("") + "</div></div>";
      }).join("");

      paintChecks();
    }

    // One delegated listener each, so re-painting never drops a live colour drag.
    sheet.addEventListener("input", function (e) {
      var el = e.target, k = el.getAttribute && el.getAttribute("data-k");
      if (!k) return;
      if (el.type === "color") {
        palette[editMode][k] = el.value.toUpperCase();
        var hex = sheet.querySelector('.sw-hex[data-k="' + k + '"]');
        if (hex) { hex.value = el.value.toUpperCase(); hex.classList.remove("bad"); }
        commitColors(); paintChecks();
      } else if (el.classList.contains("sw-hex")) {
        if (!isHex(el.value)) { el.classList.add("bad"); return; }
        el.classList.remove("bad");
        var full = toHex(parseHex(el.value));
        palette[editMode][k] = full;
        var sw = sheet.querySelector('input[type="color"][data-k="' + k + '"]');
        if (sw) sw.value = full;
        commitColors(); paintChecks();
      }
    });

    sheet.addEventListener("click", function (e) {
      var mode = e.target.closest(".seg button[data-m]");
      if (mode) {
        editMode = mode.getAttribute("data-m");
        save(KEY_THEME, editMode);
        applyTheme(editMode);   // show what is being edited
        paintPanel();
        return;
      }
      var preset = e.target.closest(".preset");
      if (preset) {
        palette = clone(PRESETS[preset.getAttribute("data-p")]);
        commitColors(); paintPanel();
        toast(preset.getAttribute("data-p") + " applied");
      }
    });

    paintPanel();
  }

  document.getElementById("colorsBtn").addEventListener("click", openColors);

  // ---------- New project inline ----------
  var newProjInput = document.getElementById("newProjInput");
  document.getElementById("addProjBtn").addEventListener("click", function () {
    newProjInput.classList.remove("hidden");
    newProjInput.value = "";
    newProjInput.focus();
  });
  newProjInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var name = this.value.trim();
      if (name) {
        if (projects.indexOf(name) === -1) projects.push(name);
        persist();
        activeProject = name;
        this.classList.add("hidden");
        render();
      }
    } else if (e.key === "Escape") { this.classList.add("hidden"); }
  });
  newProjInput.addEventListener("blur", function () { this.classList.add("hidden"); });

  // ---------- Search ----------
  var findInput = document.getElementById("findInput");
  var findWrap = document.getElementById("findWrap");
  function clearSearch() {
    query = "";
    findInput.value = "";
    findWrap.classList.remove("filled");
  }
  findInput.addEventListener("input", function () {
    query = this.value.trim();
    findWrap.classList.toggle("filled", !!this.value);
    render();
  });

  // ---------- Sort & density ----------
  var sortSelect = document.getElementById("sortSelect");
  sortSelect.value = sortMode;
  sortSelect.addEventListener("change", function () {
    sortMode = this.value; save(KEY_SORT, sortMode); render();
  });

  var viewCards = document.getElementById("viewCards");
  var viewList = document.getElementById("viewList");
  function setView(v) {
    viewMode = v; save(KEY_VIEW, v);
    viewCards.setAttribute("aria-pressed", v === "cards" ? "true" : "false");
    viewList.setAttribute("aria-pressed", v === "list" ? "true" : "false");
    render();
  }
  viewCards.addEventListener("click", function () { setView("cards"); });
  viewList.addEventListener("click", function () { setView("list"); });

  // ---------- Export ----------
  // Inside the artifact frame a synthetic <a download> click is blocked by the
  // sandbox, so ask the host to save the file. Everywhere else (own domain,
  // opened from disk) the anchor works. If neither can, hand over the JSON.
  function backupJSON() {
    return JSON.stringify({
      app: "stash", version: 3, exportedAt: new Date().toISOString(),
      theme: palette, projects: projects, snippets: snippets
    }, null, 2);
  }

  function exportBackup() {
    var json = backupJSON();
    var saver = window.claude && window.claude.downloads;
    if (saver && typeof saver.save === "function") {
      saver.save({ filename: "stash-backup.json", data: json }).then(function () {
        toast("Backup saved");
      }, function (err) {
        var code = (err && err.code) || "unavailable";
        if (code === "declined") { toast("Backup cancelled"); return; }
        if (code === "rate_limited") { toast("A save prompt is already open"); return; }
        if (code === "too_large") {
          showBackupText(json, "This stash is past the 16 MB save limit. Copy it and save it yourself:");
          return;
        }
        anchorExport(json);
      });
      return;
    }
    anchorExport(json);
  }

  function anchorExport(json) {
    if (window === window.top) {
      try {
        var blob = new Blob([json], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "stash-backup.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        toast("Backup downloaded");
        return;
      } catch (e) { /* fall through */ }
    }
    showBackupText(json, "Saving a file is blocked here. Copy this and save it as stash-backup.json:");
  }

  function showBackupText(json, why) {
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Backup">' +
        '<div class="sheet-head"><h2>Backup</h2>' +
          '<button class="icon-btn" id="bClose" aria-label="Close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
        '</div>' +
        '<div class="sheet-body">' +
          '<div class="ask-text">' + esc(why) + '</div>' +
          '<textarea class="control code-input" id="bText" readonly spellcheck="false"></textarea>' +
        '</div>' +
        '<div class="sheet-foot"><span class="gap"></span>' +
          '<button class="btn" id="bCopy">' + COPY_ICON + '<span>Copy JSON</span></button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    var ta = ov.querySelector("#bText");
    ta.value = json;                      // value, not markup — no escaping games
    var close = function () { ov.remove(); document.removeEventListener("keydown", onKey); };
    function onKey(e) { if (e.key === "Escape") { e.preventDefault(); close(); } }
    document.addEventListener("keydown", onKey);
    ov.addEventListener("mousedown", function (e) { if (e.target === ov) close(); });
    ov.querySelector("#bClose").addEventListener("click", close);
    var btn = ov.querySelector("#bCopy");
    btn.addEventListener("click", function () { copyCode({ code: json }, btn); });
    ta.setSelectionRange(0, 0);
    ta.scrollTop = 0;
    btn.focus();
  }

  document.getElementById("exportBtn").addEventListener("click", exportBackup);

  // ---------- Import ----------
  // Offers a file picker and a paste box, so a blocked picker is never a dead end.
  var importFile = document.getElementById("importFile");

  function openImport() {
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Import backup">' +
        '<div class="sheet-head"><h2>Import backup</h2>' +
          '<button class="icon-btn" id="iClose" aria-label="Close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
        '</div>' +
        '<div class="sheet-body">' +
          '<div class="ask-text">Pick a <b>stash-backup.json</b> file, or paste one in. Nothing changes until you choose merge or replace.</div>' +
          '<button class="btn quiet" id="iPick" style="align-self:flex-start">Choose a file…</button>' +
          '<div class="field"><label for="iText">Or paste the backup JSON</label>' +
            '<textarea class="control code-input" id="iText" spellcheck="false" placeholder=\'{ "app": "stash", … }\'></textarea></div>' +
        '</div>' +
        '<div class="sheet-foot"><span class="gap"></span>' +
          '<button class="btn quiet" id="iCancel">Cancel</button>' +
          '<button class="btn" id="iRead">Read it</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    var close = function () { ov.remove(); document.removeEventListener("keydown", onKey); };
    function onKey(e) { if (e.key === "Escape") { e.preventDefault(); close(); } }
    document.addEventListener("keydown", onKey);
    ov.addEventListener("mousedown", function (e) { if (e.target === ov) close(); });
    ov.querySelector("#iClose").addEventListener("click", close);
    ov.querySelector("#iCancel").addEventListener("click", close);
    ov.querySelector("#iPick").addEventListener("click", function () {
      importFile.value = "";
      importFile.click();
    });
    ov.querySelector("#iRead").addEventListener("click", function () {
      var text = ov.querySelector("#iText").value.trim();
      if (!text) { toast("Paste a backup first, or choose a file"); return; }
      if (readBackup("pasted text", text)) close();
    });
    importSheet = { close: close };
  }
  var importSheet = null;

  // Returns true when the text parsed into something importable.
  function readBackup(sourceName, text) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { toast("That isn’t valid JSON"); return false; }
    var incoming = (data && Array.isArray(data.snippets)) ? data.snippets : (Array.isArray(data) ? data : null);
    if (!incoming) { toast("No snippets found in there"); return false; }
    var clean = incoming.map(normalize).filter(function (s) { return s && (s.code || s.title); });
    if (!clean.length) { toast("No snippets found in there"); return false; }
    var incProjects = (data && Array.isArray(data.projects) ? data.projects : []).filter(function (p) {
      return typeof p === "string" && p;
    });
    var incTheme = (data && data.theme && typeof data.theme === "object") ? validPalette(data.theme) : null;
    askImport(sourceName, clean, incProjects, incTheme);
    return true;
  }

  document.getElementById("importBtn").addEventListener("click", openImport);

  importFile.addEventListener("change", function () {
    var file = this.files && this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onerror = function () { toast("Could not read that file"); };
    reader.onload = function () {
      if (readBackup(file.name, String(reader.result)) && importSheet) {
        importSheet.close();
        importSheet = null;
      }
    };
    reader.readAsText(file);
  });

  function askImport(name, clean, incProjects, incTheme) {
    var ids = {};
    snippets.forEach(function (s) { ids[s.id] = true; });
    var fresh = clean.filter(function (s) { return !ids[s.id]; });
    var dupes = clean.length - fresh.length;

    ask("Import " + clean.length + " snippet" + (clean.length === 1 ? "" : "s") + "?",
      "From <b>" + esc(name) + "</b>. Merge keeps what you have and adds the " + fresh.length + " new one" +
      (fresh.length === 1 ? "" : "s") + (dupes ? " (" + dupes + " already in your stash)" : "") +
      ". Replace throws away your current " + snippets.length + " snippet" + (snippets.length === 1 ? "" : "s") + " first" +
      (incTheme ? " and takes on the colours saved in the file" : "") + ".",
      [
        { label: "Replace all", kind: "warn", run: function () {
          snippets = clean;
          projects = incProjects.slice();
          activeProject = "__all__"; activeTag = null;
          if (incTheme) { palette = incTheme; save(KEY_COLORS, palette); paintPalette(); }
          persist(); render();
          toast("Replaced with " + clean.length + " snippet" + (clean.length === 1 ? "" : "s"));
        } },
        { label: "Merge", kind: "", run: function () {
          snippets = snippets.concat(fresh);
          incProjects.forEach(function (p) { if (projects.indexOf(p) === -1) projects.push(p); });
          persist(); render();
          toast(fresh.length
            ? "Added " + fresh.length + " snippet" + (fresh.length === 1 ? "" : "s") + (dupes ? " · " + dupes + " already there" : "")
            : "Nothing new to add — all " + dupes + " were already there");
        } }
      ]);
  }

  // ---------- Bar buttons ----------
  document.getElementById("newBtn").addEventListener("click", function () { openForm(null); });
  allItem.addEventListener("click", function () { clearSearch(); selectProject("__all__"); });
  todoItem.addEventListener("click", function () { selectProject("__todos__"); });
  addDropTarget(allItem, ""); // drop here to unfile a snippet

  document.getElementById("menuBtn").addEventListener("click", function () {
    var rail = document.getElementById("rail");
    if (rail.classList.toggle("open")) {
      var scrim = document.createElement("div");
      scrim.className = "scrim"; scrim.id = "scrim";
      scrim.addEventListener("click", closeRail);
      document.querySelector(".app").appendChild(scrim);
    } else { closeRail(); }
  });

  // ---------- Theme ----------
  var SUN = '<circle cx="12" cy="12" r="4.6"/><line x1="12" y1="1.5" x2="12" y2="3.6"/><line x1="12" y1="20.4" x2="12" y2="22.5"/><line x1="4.2" y1="4.2" x2="5.7" y2="5.7"/><line x1="18.3" y1="18.3" x2="19.8" y2="19.8"/><line x1="1.5" y1="12" x2="3.6" y2="12"/><line x1="20.4" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="19.8" x2="5.7" y2="18.3"/><line x1="18.3" y1="5.7" x2="19.8" y2="4.2"/>';
  var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  var themeIcon = document.getElementById("themeIcon");
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var eff = (t === "light" || t === "dark")
      ? t
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    themeIcon.innerHTML = eff === "dark" ? SUN : MOON;
  }
  applyTheme(load(KEY_THEME, "auto"));
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var eff = cur || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = eff === "dark" ? "light" : "dark";
    save(KEY_THEME, next);
    applyTheme(next);
  });

  // ---------- Toast ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("up");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("up"); }, 2200);
  }

  // ---------- Shortcuts ----------
  document.addEventListener("keydown", function (e) {
    if (document.querySelector(".overlay")) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "n" || e.key === "N") { e.preventDefault(); openForm(null); }
    else if (e.key === "/") { e.preventDefault(); findInput.focus(); }
  });

  // ---------- Seed one sample on the very first run ----------
  if (snippets.length === 0 && projects.length === 0 && !localStorage.getItem("stash.seeded")) {
    localStorage.setItem("stash.seeded", "1");
    snippets.push({
      id: uid(),
      title: "Debounce a function",
      project: "React helpers",
      language: "javascript",
      tags: ["hooks", "perf"],
      todos: [{ id: uid(), text: "Swap the search box over to this", done: false, createdAt: Date.now(), doneAt: null }],
      code: "function debounce(fn, wait = 300) {\n  let t;\n  return (...args) => {\n    clearTimeout(t);\n    t = setTimeout(() => fn(...args), wait);\n  };\n}",
      notes: "Use for search inputs so you don't fire a request on every keystroke. wait=300ms feels right for typeahead.",
      createdAt: Date.now(), updatedAt: Date.now()
    });
    projects.push("React helpers");
    persist();
  }

  setView(viewMode);
})();
</script>
</body>
</html>
